name: Build YuuZPrime APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'YuuZPrime-Valora-Full.zip'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'plugins/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: yuuzprime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.upgrade.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Replace ZIP-only repository with full source
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail
          archive=YuuZPrime-Valora-Full.zip
          test "$(git hash-object "$archive")" = "80c0d30db9aeec71bfdd29192ce773a2c66b5d18"
          python3 <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile, hashlib
          archive = Path('YuuZPrime-Valora-Full.zip')
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              assert len(names) == len(set(names)) == 293
              assert z.testzip() is None
              manifest = hashlib.sha256(''.join(f'{n}\t{hashlib.sha256(z.read(n)).hexdigest()}\n' for n in sorted(names)).encode()).hexdigest()
              assert manifest == '1919c7c95d0ab1858105db39c39eaf46911aeb8dc298f007c8fe6d3566251f6e'
              for n in names:
                  p = PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '\\' not in n
                  dest = Path(n)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(n))
          readme = Path('README.md')
          s = readme.read_text()
          start = s.index('1. Upload ')
          end = s.index('\n\nNo full Android build', start)
          s = s[:start] + '''1. The complete source is already extracted in this repository.
          2. Open Actions > Build YuuZPrime APK > Run workflow.
          3. Download YuuZPrime-APK from the successful run's Artifacts.
          The workflow uses locked dependencies and pins Google Cast 22.1.0 and MediaRouter 1.8.1.''' + s[end:]
          readme.write_text(s)
          print('Verified and extracted 293 files; updated README for source repository.')
          PY
          git rm -- YuuZPrime-Valora-Full.zip .github/upgrade-yuuzprime.py .github/workflows/build.yml
          git add -f -- .
          test "$(git ls-files | wc -l)" -eq 293
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace archive with complete branded YuuZPrime source'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: upgrade-source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=3072'
      TMDB_API_KEY: ${{ vars.TMDB_API_KEY }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.upgrade-source.outputs.ref }}
          persist-credentials: false

      - name: Extract original source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json && -f app.config.js ]]; then
            project="$GITHUB_WORKSPACE"
          else
            project="$RUNNER_TEMP/yuuzprime-src"
            mkdir -p "$project"
            archive="$GITHUB_WORKSPACE/YuuZPrime-Valora-Full.zip"
            test -f "$archive" || { echo '::error::Upload YuuZPrime-Valora-Full.zip at repository root'; exit 1; }
            unzip -tq "$archive"
            unzip -q "$archive" -d "$project"
            if [[ ! -f "$project/package.json" ]]; then
              mapfile -t candidates < <(find "$project" -maxdepth 3 -name app.config.js -type f)
              if [[ ${#candidates[@]} -ne 1 ]]; then echo '::error::Cannot uniquely locate Expo project'; exit 1; fi
              project="$(dirname "${candidates[0]}")"
            fi
          fi
          for f in package.json package-lock.json app.config.js src/App.tsx debug.keystore; do
            test -f "$project/$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "Source file count: $(find "$project" -type f | wc -l)"
          echo "directory=$project" >> "$GITHUB_OUTPUT"

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install locked dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Prepare native project
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          # Use Expo's normal Gradle signing and output names, not custom release hooks.
          # Changes are limited to this temporary build copy, not the uploaded ZIP.
          node <<'NODE'
          const fs = require('fs');
          const file = 'app.config.js';
          let text = fs.readFileSync(file, 'utf8');
          for (const plugin of ['with-android-signing.js', 'with-android-release-gradle.js']) {
            text = text.replace(`    './plugins/${plugin}',\n`, '');
          }
          // Pin the Cast SDK in the Expo plugin before generating Android files.
          const castOption = 'expandedController: true,';
          if (!text.includes(castOption)) throw new Error('Cast plugin configuration not found');
          text = text.replace(castOption, castOption + '\n        androidPlayServicesCastFrameworkVersion: \'22.1.0\',');
          fs.writeFileSync(file, text);
          NODE
          npm run build:sandbox
          npx --no-install expo prebuild --platform android --clean --no-install
          chmod +x android/gradlew
          # The supplied source includes a standard TEST/debug key.
          # Do not use this public key for production distribution.
          cp debug.keystore android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          # Keep native and Kotlin compiler concurrency within runner memory limits.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          updates = {'org.gradle.jvmargs': '-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8', 'org.gradle.workers.max': '2', 'org.gradle.parallel': 'false', 'kotlin.daemon.jvmargs': '-Xmx1536m', 'reactNativeArchitectures': 'arm64-v8a'}
          lines = [line for line in p.read_text().splitlines() if line.split('=',1)[0].strip() not in updates]
          lines.extend(f'{k}={v}' for k,v in updates.items())
          p.write_text('\n'.join(lines)+'\n')
          PY
          df -h .
          free -h

      - name: Pin Cast and MediaRouter (Kotlin 2.1 / SDK 36)
        working-directory: ${{ steps.source.outputs.directory }}/android
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          cat >> build.gradle <<'GRADLE'

          // Keep Cast on the Kotlin 2.x-compatible version documented by react-native-google-cast.
          // Override transitive/dynamic requests for both Cast modules and MediaRouter.
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      'androidx.mediarouter:mediarouter:1.8.1',
                      'com.google.android.gms:play-services-cast:22.1.0',
                      'com.google.android.gms:play-services-cast-framework:22.1.0'
                  )
              }
          }
          GRADLE
          echo 'Pinned MediaRouter 1.8.1 and Google Cast 22.1.0'

      - name: Check Android dependency compatibility before full build
        working-directory: ${{ steps.source.outputs.directory }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencyInsight --dependency play-services-cast-framework --configuration releaseCompileClasspath --no-daemon --max-workers=2 --console=plain -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/yuuzprime-gradle.log"
          grep -Eq 'com.google.android.gms:play-services-cast-framework:22\.1\.0([[:space:]]|$)' "$RUNNER_TEMP/yuuzprime-gradle.log" || { echo '::error::Expected Cast SDK 22.1.0 not resolved'; exit 1; }
          ./gradlew :app:dependencyInsight --dependency androidx.mediarouter:mediarouter --configuration releaseRuntimeClasspath :app:checkReleaseAarMetadata --no-daemon --max-workers=2 --console=plain -PreactNativeArchitectures=arm64-v8a 2>&1 | tee -a "$RUNNER_TEMP/yuuzprime-gradle.log"

      - name: Build standalone release APK
        working-directory: ${{ steps.source.outputs.directory }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain -PreactNativeArchitectures=arm64-v8a 2>&1 | tee -a "$RUNNER_TEMP/yuuzprime-gradle.log"

      - name: Verify and prepare APK
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          tool="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print | sort | head -n 1)
          test -n "$apk" && test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          out="$GITHUB_WORKSPACE/apk-output/YuuZPrime.apk"
          if "$tool" verify "$apk"; then
            cp "$apk" "$out"
          else
            aligned="$RUNNER_TEMP/yuuzprime-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$apk" "$aligned"
            "$tool" sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$out" "$aligned"
          fi
          "$tool" verify --verbose "$out"
          unzip -l "$out" | grep 'assets/index.android.bundle'
          echo 'Standalone testing APK ready.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: YuuZPrime-APK
          path: apk-output/YuuZPrime.apk
          if-no-files-found: error

      - name: Show actual Gradle failure in summary
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/yuuzprime-gradle.log"
          if [[ -f "$log" ]]; then
            {
              echo '## Gradle failure'
              echo '```text'
              grep -n -m 20 -A 12 -E 'What went wrong|Execution failed for task|^e: |error:|Caused by:| FAILED' "$log" || tail -n 70 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: YuuZPrime-build-log
          path: ${{ runner.temp }}/yuuzprime-gradle.log
          if-no-files-found: ignore

name: Build YuuZPrime APK
'on':
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish testing APK to GitHub Releases
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - YuuZPrime-Valora-Full.zip
      - .github/workflows/build-apk.yml
      - package.json
      - package-lock.json
      - app.config.js
      - 'src/**'
      - 'plugins/**'
      - 'native-src/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      TMDB_API_KEY: ${{ vars.TMDB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract and verify source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json && -f app.config.js ]]; then
            project="$PWD"
          elif [[ -f YuuZPrime-Valora-Full.zip ]]; then
            mkdir -p "$RUNNER_TEMP/yuuzprime-src"
            unzip -q YuuZPrime-Valora-Full.zip -d "$RUNNER_TEMP/yuuzprime-src"
            project="$RUNNER_TEMP/yuuzprime-src"
          else
            echo '::error::Upload YuuZPrime-Valora-Full.zip in repository root.'
            exit 1
          fi
          for file in package.json package-lock.json app.config.js src/App.tsx; do
            test -f "$project/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "directory=$project" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install project dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate Android native project
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          npm run build:sandbox
          npx --no-install expo prebuild --platform android --clean --no-install
          test -f android/gradlew
          chmod +x android/gradlew
      - name: Build APK
        working-directory: ${{ steps.source.outputs.directory }}/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - name: Verify and prepare APK
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)
          test -n "$apk" && test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$apk" "$GITHUB_WORKSPACE/apk-output/YuuZPrime.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$GITHUB_WORKSPACE/apk-output/YuuZPrime.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: apk-output/YuuZPrime.apk
          archive: false
          if-no-files-found: error
      - name: Publish optional testing release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" apk-output/YuuZPrime.apk --title "YuuZPrime test build ${GITHUB_RUN_NUMBER}" --notes 'Testing APK; not production signed.' --prerelease
          

name: Build YuuZPrime APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Android APK
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/YuuZPrime.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify apk-output/YuuZPrime.apk
      - uses: actions/upload-artifact@v7
        with:
          name: YuuZPrime-APK
          path: apk-output/YuuZPrime.apk
          if-no-files-found: error
